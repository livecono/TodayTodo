<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">오늘 할 일 펫 키우기 스케줄러</title>
  <desc id="desc">보라색과 청록색 그라데이션 배경 위에 오늘 할 일과 펫 키우기 스케줄러가 흰색으로 표시된 로고</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7954e8"/>
      <stop offset="0.5" stop-color="#3f9eb1"/>
      <stop offset="1" stop-color="#10ad7a"/>
    </linearGradient>
  </defs>
  <rect width="768" height="768" fill="url(#background)"/>
  <g fill="#fff" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="900">
    <text x="384" y="430" font-size="142">오늘 할 일</text>
    <text x="384" y="516" font-size="54" letter-spacing="1">펫 키우기 스케줄러</text>
  </g>
</svg>
